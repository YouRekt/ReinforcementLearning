[project]
name = "reinforcementlearning"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "imageio[ffmpeg]>=2.38.1",
    "matplotlib>=3.11.2",
    "mpe2>=1.1.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
